name: my_spots
description: "A new Flutter project."
publish_to: 'none'

version: 1.1.0+2

environment:
  sdk: ^3.10.7

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  package_info_plus: 10.2.1

  # Outils GPS
  cupertino_icons: ^1.0.6
  geolocator: ^14.0.2
  path_provider: ^2.1.3
  intl: ^0.20.2

  # Cartographie
  flutter_map: ^8.2.2
  latlong2: ^0.9.1

  # Réseau / navigation
  url_launcher: ^6.3.0
  http: ^1.2.0

  # Préférences / sons / configuration
  shared_preferences: ^2.3.3
  audioplayers: ^6.1.0
  flutter_dotenv: ^5.1.0

  # Export / import GPX
  share_plus: ^13.3.0
  file_picker: ^13.1.0
  xml: ^6.5.0

  # Cartes hors ligne
  flutter_map_tile_caching: ^10.1.1

  # ObjectBox
  objectbox: 4.3.1
  objectbox_flutter_libs: 4.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  mockito: ^5.4.4
  build_runner: ^2.4.13
  objectbox_generator: 4.3.1
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.2

flutter:
  uses-material-design: true

  assets:
    - assets/sounds/beep.mp3
    - README.md
    - CHANGELOG.md

flutter_launcher_icons:
  android: "launcher_icon"
  ios: false
  image_path: "app_icon.png"
  min_sdk_android: 21
